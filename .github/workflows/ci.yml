name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt tzdata
      - run: python -m compileall -q maya
      - run: python tests/test_pure.py
      - run: python tools/count_commands.py
